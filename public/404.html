<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found — Curve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 'Noto Sans', system-ui, sans-serif; background: #f8fafc; color: #0f172a;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e2e8f0; } p { color: #94a3b8 !important; } }
      main { text-align: center; padding: 24px; }
      img { width: 56px; height: 56px; }
      h1 { margin: 16px 0 4px; font-size: 20px; }
      p { margin: 0 0 20px; color: #475569; }
      a {
        display: inline-block; padding: 8px 18px; border-radius: 8px; color: #fff; text-decoration: none;
        background: linear-gradient(135deg, #4d47bd, #753cec);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Page not found</h1>
      <p>There’s nothing at this address.</p>
      <a href="/">Open Curve</a>
    </main>
  </body>
</html>
